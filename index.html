<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>電車乗り換え検索</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo",
          sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
        min-height: 100vh;
        color: #e2e8f0;
      }
      .container {
        max-width: 820px;
        margin: 0 auto;
        padding: 14px;
      }
      header {
        text-align: center;
        padding: 18px 0 12px;
      }
      header h1 {
        font-size: 22px;
        background: linear-gradient(90deg, #60a5fa, #34d399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      header p {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 2px;
      }

      .card {
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(100, 116, 139, 0.25);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 10px;
      }

      label {
        display: block;
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 2px;
        font-weight: 600;
      }
      input[type="text"],
      input[type="password"],
      input[type="number"],
      input[type="date"],
      input[type="time"],
      select,
      textarea {
        width: 100%;
        padding: 9px 11px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(100, 116, 139, 0.35);
        border-radius: 9px;
        color: #e2e8f0;
        font-size: 16px;
        outline: none;
        transition: border-color 0.2s;
        -webkit-appearance: none;
      }
      select {
        -webkit-appearance: menulist;
      }
      input[type="text"]:focus,
      input[type="password"]:focus,
      input[type="number"]:focus,
      select:focus {
        border-color: #60a5fa;
      }
      input::placeholder {
        color: #64748b;
      }
      select {
        cursor: pointer;
      }
      select option {
        background: #1e293b;
      }

      .station-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 10px;
      }
      .station-col {
        flex: 1;
      }
      .station-input-wrap {
        display: flex;
        gap: 5px;
      }
      .station-input-wrap input {
        flex: 1;
      }

      .icon-btn {
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 9px;
        color: #60a5fa;
        cursor: pointer;
        font-size: 12px;
        padding: 9px 8px;
        white-space: nowrap;
        transition: all 0.15s;
        display: flex;
        align-items: center;
      }
      .icon-btn:hover:not(:disabled) {
        background: rgba(96, 165, 250, 0.25);
      }
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .icon-btn.green {
        background: rgba(52, 211, 153, 0.12);
        border-color: rgba(52, 211, 153, 0.25);
        color: #34d399;
      }
      .icon-btn.green:hover:not(:disabled) {
        background: rgba(52, 211, 153, 0.25);
      }
      .icon-btn.locating {
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .swap-btn {
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.25);
        border-radius: 50%;
        width: 34px;
        height: 34px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #60a5fa;
        font-size: 15px;
        margin-top: 18px;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .swap-btn:hover {
        background: rgba(96, 165, 250, 0.3);
      }

      .sub-text {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 2px;
      }
      .sub-text.ok {
        color: #34d399;
      }
      .sub-text.err {
        color: #fca5a5;
      }

      .via-row {
        margin-bottom: 10px;
      }

      .options-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 8px;
        margin-bottom: 10px;
      }
      .check-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .check-label {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        color: #cbd5e1;
        cursor: pointer;
      }
      .check-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #60a5fa;
        cursor: pointer;
      }

      .detail-toggle {
        font-size: 12px;
        color: #64748b;
        cursor: pointer;
        margin-bottom: 10px;
        border: none;
        background: none;
      }
      .detail-toggle:hover {
        color: #94a3b8;
      }
      .detail-section {
        display: none;
        margin-bottom: 12px;
      }
      .detail-section.open {
        display: block;
      }

      .transport-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 10px;
      }
      .transport-chip {
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 12px;
        border: 1px solid rgba(100, 116, 139, 0.35);
        background: rgba(15, 23, 42, 0.5);
        color: #cbd5e1;
        cursor: pointer;
        transition: all 0.15s;
        user-select: none;
      }
      .transport-chip.off {
        opacity: 0.35;
        text-decoration: line-through;
        border-color: rgba(239, 68, 68, 0.3);
      }

      .search-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border: none;
        border-radius: 11px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .search-btn:hover:not(:disabled) {
        transform: translateY(-1px);
      }
      .search-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .tool-btn {
        padding: 7px 11px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid rgba(100, 116, 139, 0.3);
        background: rgba(30, 41, 59, 0.9);
        color: #cbd5e1;
        transition: all 0.15s;
      }
      .tool-btn:hover {
        background: rgba(96, 165, 250, 0.15);
        color: #93c5fd;
      }
      .tool-btn.active {
        background: rgba(96, 165, 250, 0.2);
        color: #60a5fa;
        border-color: #60a5fa;
      }
      .tool-btn.orange {
        color: #fbbf24;
        border-color: rgba(251, 191, 36, 0.3);
      }
      .tool-btn.green2 {
        color: #34d399;
        border-color: rgba(52, 211, 153, 0.3);
      }

      .route-card {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(100, 116, 139, 0.25);
        border-radius: 14px;
        margin-bottom: 10px;
        overflow: hidden;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .route-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: rgba(96, 165, 250, 0.08);
        border-bottom: 1px solid rgba(100, 116, 139, 0.15);
        flex-wrap: wrap;
        gap: 6px;
      }
      .route-label {
        font-size: 13px;
        font-weight: 700;
        color: #60a5fa;
      }
      .route-time-big {
        font-size: 20px;
        font-weight: 700;
        color: #f1f5f9;
        letter-spacing: -0.5px;
      }
      .route-time-big .arr {
        color: #34d399;
      }
      .route-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .route-badge {
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .badge-duration {
        background: rgba(96, 165, 250, 0.15);
        color: #93c5fd;
      }
      .badge-transfer {
        background: rgba(251, 191, 36, 0.12);
        color: #fde68a;
      }
      .badge-fare {
        background: rgba(52, 211, 153, 0.12);
        color: #6ee7b7;
      }

      .route-timeline {
        padding: 12px 16px 12px 20px;
      }
      .tl-segment {
        position: relative;
        padding-left: 28px;
        padding-bottom: 0;
      }
      .tl-segment:last-child {
        padding-bottom: 0;
      }
      .tl-line {
        position: absolute;
        left: 8px;
        top: 18px;
        bottom: 0;
        width: 4px;
        border-radius: 2px;
      }
      .tl-dot {
        position: absolute;
        left: 3px;
        top: 5px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 3px solid;
        background: #0f172a;
        z-index: 1;
      }
      .tl-dot.start {
        border-color: #60a5fa;
        background: #60a5fa;
      }
      .tl-dot.end {
        border-color: #34d399;
        background: #34d399;
      }
      .tl-dot.transfer {
        border-color: #fbbf24;
        background: #fbbf24;
      }

      .tl-station {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 2px;
      }
      .tl-station-time {
        font-size: 15px;
        font-weight: 700;
        color: #f1f5f9;
        min-width: 42px;
        font-variant-numeric: tabular-nums;
      }
      .tl-station-name {
        font-size: 14px;
        font-weight: 600;
        color: #e2e8f0;
      }
      .tl-station-platform {
        font-size: 13px;
        color: #94a3b8;
        margin-left: 4px;
      }

      .tl-ride {
        padding: 6px 0 6px 0;
        margin-left: 0;
      }
      .tl-ride-line {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 3px;
      }
      .line-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 28px;
        border-radius: 50%;
        font-size: 11px;
        font-weight: 800;
        color: #fff;
        letter-spacing: -0.5px;
        line-height: 1;
        padding: 0 3px;
        flex-shrink: 0;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      .tl-ride-detail {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
      }
      .tl-ride-detail span {
        margin-right: 10px;
      }

      .tl-stops-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        margin: 2px 0 0;
        border: 1px solid rgba(100, 116, 139, 0.2);
        border-radius: 6px;
        font-size: 13px;
        color: #64748b;
        cursor: pointer;
        background: rgba(15, 23, 42, 0.3);
        transition: all 0.15s;
      }
      .tl-stops-toggle:hover {
        color: #94a3b8;
        border-color: rgba(100, 116, 139, 0.4);
      }
      .tl-stops-toggle .arrow {
        transition: transform 0.2s;
        display: inline-block;
      }
      .tl-stops-toggle.open .arrow {
        transform: rotate(90deg);
      }
      .tl-stops-list {
        display: none;
        margin: 4px 0 2px;
        padding: 0;
      }
      .tl-stops-list.open {
        display: block;
      }
      .tl-stop {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
        position: relative;
      }
      .tl-stop-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .tl-stop-time {
        font-size: 13px;
        color: #94a3b8;
        min-width: 38px;
        font-variant-numeric: tabular-nums;
      }
      .tl-stop-name {
        font-size: 13px;
        color: #94a3b8;
      }

      .tl-transfer-box {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px;
        margin: 4px 0;
        background: rgba(251, 191, 36, 0.08);
        border: 1px dashed rgba(251, 191, 36, 0.25);
        border-radius: 8px;
        font-size: 13px;
        color: #fde68a;
      }

      .route-notes {
        padding: 8px 16px 12px;
        border-top: 1px solid rgba(100, 116, 139, 0.12);
      }
      .route-notes p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 2px;
      }
      .route-notes .warn {
        color: #fca5a5;
      }

      .result-card {
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(100, 116, 139, 0.25);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 10px;
        animation: fadeIn 0.3s ease;
      }
      .result-card h3 {
        color: #60a5fa;
        margin-bottom: 10px;
        font-size: 14px;
      }
      .result-content {
        line-height: 1.75;
        font-size: 13px;
        color: #cbd5e1;
      }
      .result-content h1,
      .result-content h2,
      .result-content h3,
      .result-content h4 {
        color: #60a5fa;
        margin: 10px 0 4px;
      }
      .result-content h1 {
        font-size: 17px;
      }
      .result-content h2 {
        font-size: 15px;
      }
      .result-content h3 {
        font-size: 14px;
      }
      .result-content p {
        margin-bottom: 6px;
      }
      .result-content strong {
        color: #f1f5f9;
      }
      .result-content ul,
      .result-content ol {
        padding-left: 20px;
        margin-bottom: 6px;
      }
      .result-content li {
        margin-bottom: 2px;
      }
      .result-content a {
        color: #38bdf8;
        text-decoration: none;
      }
      .result-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0;
      }
      .result-content th,
      .result-content td {
        border: 1px solid rgba(100, 116, 139, 0.3);
        padding: 5px 8px;
        text-align: left;
        font-size: 13px;
      }
      .result-content th {
        background: rgba(96, 165, 250, 0.1);
        color: #60a5fa;
      }

      .sources {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(100, 116, 139, 0.15);
      }
      .sources h4 {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 4px;
      }
      .sources a {
        display: inline-block;
        font-size: 13px;
        color: #38bdf8;
        text-decoration: none;
        margin-right: 10px;
      }

      .loading {
        text-align: center;
        padding: 28px;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(96, 165, 250, 0.2);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading p {
        color: #94a3b8;
        font-size: 12px;
      }

      .error-msg {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 11px;
        padding: 12px;
        color: #fca5a5;
        font-size: 12px;
        margin-bottom: 10px;
      }

      .alarm-bar {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.3);
        border-radius: 11px;
        margin-bottom: 10px;
      }
      .alarm-bar.active {
        display: flex;
      }
      .alarm-time {
        font-size: 24px;
        font-weight: 700;
        color: #fbbf24;
        font-variant-numeric: tabular-nums;
      }
      .alarm-label {
        flex: 1;
        font-size: 13px;
        color: #fde68a;
      }
      .alarm-cancel {
        padding: 5px 12px;
        border-radius: 7px;
        border: 1px solid rgba(251, 191, 36, 0.4);
        background: transparent;
        color: #fbbf24;
        cursor: pointer;
        font-size: 12px;
      }

      .expense-bar {
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid rgba(139, 92, 246, 0.2);
        border-radius: 11px;
        padding: 10px 14px;
        margin-bottom: 10px;
      }
      .expense-bar h4 {
        font-size: 12px;
        color: #a78bfa;
        margin-bottom: 6px;
      }
      .expense-list {
        font-size: 13px;
        color: #c4b5fd;
      }
      .expense-list .item {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
        border-bottom: 1px solid rgba(139, 92, 246, 0.1);
      }
      .expense-total {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        color: #a78bfa;
        padding-top: 4px;
        font-size: 13px;
      }
      .expense-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .expense-actions button {
        padding: 3px 10px;
        border-radius: 7px;
        border: 1px solid rgba(139, 92, 246, 0.3);
        background: transparent;
        color: #a78bfa;
        cursor: pointer;
        font-size: 13px;
      }

      .section-title {
        color: #94a3b8;
        font-size: 12px;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: rgba(96, 165, 250, 0.08);
        border: 1px solid rgba(96, 165, 250, 0.18);
        border-radius: 18px;
        padding: 4px 11px;
        font-size: 13px;
        color: #93c5fd;
        cursor: pointer;
        margin: 0 5px 5px 0;
      }
      .tag:hover {
        background: rgba(96, 165, 250, 0.18);
      }
      .tag .del {
        color: #64748b;
        margin-left: 2px;
        font-size: 13px;
      }
      .tag .del:hover {
        color: #fca5a5;
      }
      .tag.fav {
        border-color: rgba(251, 191, 36, 0.25);
        color: #fde68a;
        background: rgba(251, 191, 36, 0.06);
      }

      .settings-toggle {
        text-align: right;
        margin-bottom: 6px;
      }
      .settings-toggle button {
        background: none;
        border: none;
        color: #64748b;
        cursor: pointer;
        font-size: 12px;
      }
      .settings-toggle button:hover {
        color: #94a3b8;
      }
      .settings-panel {
        display: none;
        margin-bottom: 10px;
      }
      .settings-panel.open {
        display: block;
      }

      .crowd-bar {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 12px;
        vertical-align: middle;
      }
      .crowd-bar .crowd-icons {
        display: inline-flex;
        margin-left: -2px;
        letter-spacing: -6px;
      }
      .crowd-bar .ci {
        font-size: 14px;
        opacity: 0.2;
      }
      .crowd-bar .ci.on {
        opacity: 1;
      }
      .crowd-bar .crowd-label {
        margin-left: 3px;
        font-weight: 600;
      }
      .crowd-1 {
        background: rgba(52, 211, 153, 0.1);
        color: #34d399;
      }
      .crowd-2 {
        background: rgba(96, 165, 250, 0.1);
        color: #60a5fa;
      }
      .crowd-3 {
        background: rgba(251, 191, 36, 0.1);
        color: #fbbf24;
      }
      .crowd-4 {
        background: rgba(249, 115, 22, 0.1);
        color: #f97316;
      }
      .crowd-5 {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
      }

      .tl-delay {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        margin: 4px 0;
        background: rgba(249, 115, 22, 0.08);
        border: 1px solid rgba(249, 115, 22, 0.25);
        border-radius: 8px;
      }
      .tl-delay-icon {
        color: #f97316;
        font-size: 16px;
        flex-shrink: 0;
      }
      .tl-delay-text {
        font-size: 13px;
        font-weight: 600;
        color: #f97316;
      }
      .tl-delay-reason {
        font-size: 12px;
        color: #fb923c;
        font-weight: 400;
        margin-left: 4px;
      }

      .verify-badge {
        display: none;
        align-items: center;
        gap: 5px;
        padding: 4px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .verify-badge.verifying {
        display: inline-flex;
        background: rgba(96, 165, 250, 0.1);
        border: 1px solid rgba(96, 165, 250, 0.25);
        color: #93c5fd;
      }
      .verify-badge.done {
        display: inline-flex;
        background: rgba(52, 211, 153, 0.1);
        border: 1px solid rgba(52, 211, 153, 0.25);
        color: #34d399;
      }
      .verify-badge.corrected {
        display: inline-flex;
        background: rgba(251, 191, 36, 0.1);
        border: 1px solid rgba(251, 191, 36, 0.25);
        color: #fde68a;
        animation: pulse 2s ease-in-out;
      }

      .info-banner {
        display: none;
        padding: 8px 12px;
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 11px;
        margin-bottom: 10px;
        font-size: 12px;
        color: #fca5a5;
      }
      .info-banner.show {
        display: block;
      }
      .info-banner.ok {
        background: rgba(52, 211, 153, 0.08);
        border-color: rgba(52, 211, 153, 0.2);
        color: #34d399;
      }

      /* [修正7] 混雑度推定ラベル */
      .crowd-estimate-label {
        font-size: 10px;
        color: #64748b;
        font-weight: 400;
        margin-left: 2px;
      }

      /* [修正8] 到着駅不一致バナー */
      .dest-warn-banner {
        padding: 8px 12px;
        background: rgba(249, 115, 22, 0.1);
        border: 1px solid rgba(249, 115, 22, 0.3);
        border-radius: 10px;
        margin-bottom: 10px;
        font-size: 13px;
        color: #fb923c;
        font-weight: 600;
      }

      /* [修正5] 運賃注記バナー */
      .fare-warn-banner {
        padding: 6px 12px;
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid rgba(139, 92, 246, 0.2);
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 12px;
        color: #a78bfa;
      }

      .mode-tabs {
        display: flex;
        margin-bottom: 10px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(100, 116, 139, 0.3);
      }
      .mode-tab {
        flex: 1;
        padding: 9px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: rgba(15, 23, 42, 0.5);
        color: #94a3b8;
        border: none;
      }
      .mode-tab.active {
        background: rgba(96, 165, 250, 0.15);
        color: #60a5fa;
      }

      @media (max-width: 600px) {
        .station-row {
          flex-direction: column;
        }
        .swap-btn {
          margin-top: 0;
          align-self: center;
          transform: rotate(90deg);
        }
        .options-grid {
          grid-template-columns: 1fr 1fr;
        }
        .route-time-big {
          font-size: 18px;
        }
      }

      [hidden] {
        display: none !important;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 3px;
      }
      .settings-panel label {
        margin-top: 10px;
      }
      .primary-link {
        display: inline-block;
        background: #2563eb;
        border-radius: 9px;
        color: white;
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 600;
        margin: 10px 0;
      }
      .sub-text {
        line-height: 1.65;
      }
      .result-content {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .toolbar button {
        min-height: 40px;
      }
      .selected-route {
        border: 2px solid #60a5fa;
      }
      .tag button {
        background: transparent;
        color: inherit;
        border: 0;
        cursor: pointer;
        padding: 3px;
      }
      summary {
        cursor: pointer;
        color: #93c5fd;
        padding: 8px 0;
      }
      .check-row {
        margin-top: 10px;
      }
      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      header {
        text-align: left;
        padding: 12px 0 18px;
      }
      header h1 {
        font-size: 26px;
      }
      .route-notes {
        line-height: 1.7;
      }
      .mode-tab {
        min-height: 44px;
      }
      #cancelSearch {
        width: 100%;
        margin-top: 8px;
      }
      .transport-chip {
        min-height: 36px;
      }
      .station-col {
        min-width: 0;
      }
      @media (max-width: 600px) {
        header h1 {
          font-size: 23px;
        }
        .station-input-wrap input {
          min-width: 0;
        }
        .container {
          padding: 12px;
        }
        .options-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
    <script src="train-core.js" defer></script>
    <script src="holidays.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="title-row">
        <div>
          <h1>電車乗り換え検索</h1>
          <p>日時と条件を指定して、乗りたい経路を探す</p>
        </div>
        <button
          class="tool-btn"
          onclick="toggleSettings()"
          aria-controls="settingsPanel"
          id="settingsToggle"
          aria-expanded="false"
        >
          API設定
        </button>
      </header>
      <section
        class="settings-panel card"
        id="settingsPanel"
        aria-label="API設定"
      >
        <p class="sub-text">
          無料の検索はキー不要です。アプリ内表示やAI参考検索を使うときだけ設定してください。キーはこのPCのサーバーのメモリーで扱い、終了時に消えます。
        </p>
        <label for="ekispertKey"
          >駅すぱあとAPIキー（ダイヤ探索の契約が必要）</label
        ><input type="password" id="ekispertKey" autocomplete="off" />
        <label for="odptKey">ODPT APIキー（任意）</label
        ><input type="password" id="odptKey" autocomplete="off" />
        <label for="apiKey">OpenAI APIキー（任意・AI参考検索用）</label
        ><input type="password" id="apiKey" autocomplete="off" />
        <label for="aiModel">AI参考検索のモデル</label
        ><select id="aiModel">
          <option value="gpt-6-luna">GPT-6 Luna</option>
          <option value="gpt-6.1-sol">GPT-6.1 Sol</option>
        </select>
        <label for="timeoutSec">取得の待ち時間（秒）</label
        ><input id="timeoutSec" type="number" value="120" min="10" max="120" />
        <div class="toolbar" style="margin-top: 12px">
          <button class="tool-btn" onclick="saveSettings()">
            入力したキーを使う</button
          ><button class="tool-btn" onclick="clearSettings()">キーを消去</button
          ><a class="tool-btn" href="test_api.html">API接続テスト</a>
        </div>
        <p id="settingsStatus" class="sub-text" role="status"></p>
      </section>
      <nav class="mode-tabs" aria-label="検索の種類">
        <button
          class="mode-tab active"
          id="modeRoute"
          onclick="setMode('route')"
          aria-pressed="true"
        >
          経路</button
        ><button
          class="mode-tab"
          id="modeTimetable"
          onclick="setMode('timetable')"
          aria-pressed="false"
        >
          時刻表</button
        ><button
          class="mode-tab"
          id="modeCommuter"
          onclick="setMode('commuter')"
          aria-pressed="false"
        >
          定期券</button
        ><button
          class="mode-tab"
          id="modeStatus"
          onclick="setMode('status')"
          aria-pressed="false"
        >
          運行情報
        </button>
      </nav>
      <div id="infoBanner" class="info-banner" role="status"></div>
      <form
        id="searchForm"
        class="card"
        onsubmit="
          event.preventDefault();
          doSearch();
        "
      >
        <div class="station-row" id="stationRow">
          <div class="station-col">
            <label for="fromStation" id="fromLabel">出発駅</label>
            <div class="station-input-wrap">
              <input
                type="text"
                id="fromStation"
                placeholder="例：川間"
                maxlength="100"
                autocomplete="off"
              /><button
                class="icon-btn green"
                id="gpsBtn"
                type="button"
                onclick="detectStation()"
                aria-label="現在地から近くの駅を探す"
              >
                近くの駅</button
              ><button
                class="icon-btn"
                type="button"
                onclick="voiceInput('fromStation')"
                aria-label="出発駅を音声入力"
              >
                音声
              </button>
            </div>
            <p id="gpsStatus" class="sub-text" role="status"></p>
          </div>
          <button
            class="swap-btn"
            id="swapBtn"
            type="button"
            onclick="swapStations()"
            aria-label="出発駅と到着駅を入れ替える"
          >
            ⇄
          </button>
          <div class="station-col" id="toCol">
            <label for="toStation">到着駅</label>
            <div class="station-input-wrap">
              <input
                type="text"
                id="toStation"
                placeholder="例：大宮"
                maxlength="100"
                autocomplete="off"
              /><button
                class="icon-btn"
                type="button"
                onclick="voiceInput('toStation')"
                aria-label="到着駅を音声入力"
              >
                音声
              </button>
            </div>
          </div>
        </div>
        <div class="options-grid" id="optionsGrid">
          <div id="dateField">
            <label for="date">利用日（日本時間）</label
            ><input type="date" id="date" />
          </div>
          <div id="timeField">
            <label for="time"
              >時刻
              <button
                class="tool-btn"
                type="button"
                onclick="updateNow()"
                style="padding: 2px 6px; min-height: 24px"
              >
                今に設定
              </button></label
            ><input type="time" id="time" />
          </div>
          <div id="timeTypeField">
            <label for="timeType">時刻の指定</label
            ><select id="timeType">
              <option value="departure">出発</option>
              <option value="arrival">到着</option>
              <option value="first">始発</option>
              <option value="last">終電</option>
            </select>
          </div>
          <div id="priorityField">
            <label for="priority">優先する条件</label
            ><select id="priority">
              <option value="recommended">おすすめ</option>
              <option value="fast">到着が早い</option>
              <option value="cheap">料金が安い</option>
              <option value="less_transfer">乗換が少ない</option>
            </select>
          </div>
        </div>
        <div id="routeOptions">
          <label for="routeProvider">検索方法</label
          ><select id="routeProvider" onchange="updateProviderHint()">
            <option value="yahoo">Yahoo!乗換案内で確認（無料）</option>
            <option value="ekispert">アプリ内に表示（駅すぱあとAPI）</option>
          </select>
          <p id="providerHint" class="sub-text"></p>
          <details id="detailSection">
            <summary>経由駅・追加条件</summary>
            <div class="via-row">
              <label for="viaStation"
                >経由駅（無料検索は1駅、APIは最大3駅）</label
              ><input
                type="text"
                id="viaStation"
                placeholder="例：春日部"
                maxlength="100"
              />
            </div>
            <label for="walkSpeed">歩く速さ（検索先の段階に合わせて送信）</label
            ><select id="walkSpeed">
              <option value="slow">ゆっくり</option>
              <option value="normal" selected>標準</option>
              <option value="slightly_fast">少し急ぐ</option>
              <option value="fast">急ぐ</option></select
            ><label style="margin-top: 10px">使う交通機関（押すと除外）</label>
            <div class="transport-row">
              <button
                class="transport-chip"
                data-key="shinkansen"
                type="button"
                onclick="toggleTransport(this)"
                aria-pressed="true"
              >
                新幹線</button
              ><button
                class="transport-chip"
                data-key="express"
                type="button"
                onclick="toggleTransport(this)"
                aria-pressed="true"
              >
                有料特急</button
              ><button
                class="transport-chip"
                data-key="airplane"
                type="button"
                onclick="toggleTransport(this)"
                aria-pressed="true"
              >
                飛行機</button
              ><button
                class="transport-chip"
                data-key="bus"
                type="button"
                onclick="toggleTransport(this)"
                aria-pressed="true"
              >
                路線バス</button
              ><button
                class="transport-chip"
                data-key="highwaybus"
                type="button"
                onclick="toggleTransport(this)"
                aria-pressed="true"
              >
                高速バス</button
              ><button
                class="transport-chip"
                data-key="ferry"
                type="button"
                onclick="toggleTransport(this)"
                aria-pressed="true"
              >
                フェリー
              </button>
            </div>
            <p class="sub-text">
              以下は検索先で確認する条件です。API接続では対応するまで検索を停止します。
            </p>
            <div class="check-row">
              <label class="check-label"
                ><input
                  type="checkbox"
                  id="optBarrierFree"
                />段差の少ない経路</label
              ><label class="check-label"
                ><input type="checkbox" id="optAvoidDelay" />遅延を避ける</label
              ><label class="check-label"
                ><input
                  type="checkbox"
                  id="optCommuterPass"
                />定期券区間を使う</label
              >
            </div>
            <div id="commuterPassSection" hidden>
              <label for="passFrom">定期券区間の出発駅</label
              ><input type="text" id="passFrom" maxlength="100" /><label
                for="passTo"
                >定期券区間の到着駅</label
              ><input type="text" id="passTo" maxlength="100" />
            </div>
            <label for="trainName">指定列車</label
            ><input
              type="text"
              id="trainName"
              maxlength="100"
              placeholder="例：のぞみ"
            /><label for="specialTicket">特別なきっぷ</label
            ><select id="specialTicket">
              <option value="none">指定なし</option>
              <option value="seishun18">青春18きっぷ</option>
              <option value="freepass">フリーパス</option>
              <option value="jrpass">ジャパンレールパス</option>
            </select>
            <div id="freepassSection" hidden>
              <label for="freepassName">フリーパス名</label
              ><input type="text" id="freepassName" maxlength="100" />
            </div>
          </details>
        </div>
        <p id="modeHint" class="sub-text" style="margin: 8px 0"></p>
        <button class="search-btn" id="searchBtn" type="submit">
          経路を検索</button
        ><button
          class="tool-btn"
          id="cancelSearch"
          type="button"
          onclick="cancelSearch()"
          hidden
        >
          検索を中止
        </button>
      </form>
      <div class="alarm-bar" id="alarmBar">
        <span class="alarm-time" id="alarmTime"></span
        ><span class="alarm-label" id="alarmLabel"></span
        ><button class="alarm-cancel" onclick="cancelAlarm()">解除</button>
      </div>
      <div class="verify-badge" id="verifyBadge" role="status"></div>
      <div class="toolbar" id="toolbar" hidden>
        <button class="tool-btn" id="shiftBack" onclick="searchShift(-1)">
          5分前の条件</button
        ><button class="tool-btn" id="shiftForward" onclick="searchShift(1)">
          5分後の条件</button
        ><button class="tool-btn" id="walkBtn" onclick="openWalkNav()">
          徒歩地図</button
        ><button class="tool-btn" onclick="copyResult()">コピー</button
        ><button class="tool-btn" onclick="shareResult()">共有</button
        ><button class="tool-btn orange" id="favBtn" onclick="toggleFavorite()">
          ☆ お気に入り</button
        ><button
          class="tool-btn orange"
          id="alarmBtn"
          onclick="setAlarm()"
          hidden
        >
          降車アラーム</button
        ><button
          class="tool-btn green2"
          id="expenseBtn"
          onclick="addExpenseFromResult()"
        >
          旅費メモ
        </button>
      </div>
      <section
        id="results"
        aria-label="検索結果"
        aria-live="polite"
        aria-busy="false"
      ></section>
      <section class="expense-bar" id="expenseBar" hidden>
        <h4>旅費メモ</h4>
        <div class="expense-list" id="expenseList"></div>
        <div class="expense-total">
          <span>合計</span><span id="expenseTotal"></span>
        </div>
        <div class="expense-actions">
          <button onclick="copyExpenses()">コピー</button
          ><button onclick="clearExpenses()">クリア</button>
        </div>
      </section>
      <section id="favSection" class="card" hidden>
        <h2 class="section-title">お気に入り</h2>
        <div id="favList"></div>
      </section>
      <section id="historySection" class="card" hidden>
        <h2 class="section-title">最近の検索</h2>
        <div id="historyList"></div>
      </section>
      <footer class="sub-text" style="padding: 12px 0">
        時刻・運賃は提供元の掲載内容に基づきます。運行情報の対象範囲と更新日時を確認してください。
      </footer>
    </main>
  </body>
</html>
