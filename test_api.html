<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API接続テスト</title>
    <style>
      body {
        font: 16px/1.7 system-ui;
        background: #0f172a;
        color: #e2e8f0;
        max-width: 720px;
        margin: 30px auto;
        padding: 16px;
      }
      a {
        color: #60a5fa;
      }
      select,
      button {
        font: inherit;
        padding: 10px;
        border-radius: 8px;
        background: #1e293b;
        color: #e2e8f0;
        border: 1px solid #64748b;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #1e293b;
        padding: 16px;
      }
      button:focus-visible {
        outline: 3px solid #60a5fa;
      }
    </style>
    <script src="train-core.js" defer></script>
    <script src="test-api.js" defer></script>
  </head>
  <body>
    <a href="index.html">← 乗換検索へ戻る</a>
    <h1>API接続テスト</h1>
    <p>
      乗換検索のAPI設定で入力したOpenAIキーを使います。ボタン1回につき1回だけ呼び出します。ウェブ検索を含むAPI料金が発生します。
    </p>
    <p>このテストでは鉄道の時刻・運賃を推測させません。</p>
    <label for="model">モデル</label
    ><select id="model">
      <option value="gpt-6-luna">GPT-6 Luna</option>
      <option value="gpt-6.1-sol">GPT-6.1 Sol</option></select
    ><button id="test">接続をテスト（API課金）</button
    ><button id="cancel" hidden>中止</button>
    <pre id="result" role="status">未実行</pre>
  </body>
</html>
